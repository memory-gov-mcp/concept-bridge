<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>概念桥 · 离线极简界面</title>
<style>
  :root {
    --bg: #0b1020; --panel: #141a2e; --line: #263049; --fg: #e6ebf5;
    --dim: #93a0bd; --accent: #5eead4; --warn: #fbbf24; --bad: #fb7185;
    --mat: #38bdf8; --bio: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    padding: 22px 28px 14px; border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .tag { font-size: 12px; color: var(--dim); }
  main { padding: 20px 28px 60px; max-width: 1180px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  input[type=text] {
    flex: 1 1 320px; min-width: 220px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #0e1424; color: var(--fg); font-size: 15px;
  }
  button {
    padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: #1b2440; color: var(--fg); cursor: pointer; font-size: 14px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .presets button { font-size: 13px; padding: 6px 12px; background: transparent; }
  .bar {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); font-size: 13px; color: var(--dim); margin-bottom: 20px;
  }
  .badge { padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); font-size: 12px; }
  .badge.ok { color: var(--accent); border-color: var(--accent); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  .bridge {
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    margin-bottom: 18px; overflow: hidden;
  }
  .bridge-head {
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim);
  }
  .cols { display: grid; grid-template-columns: 1fr 200px 1fr; gap: 0; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .col { padding: 16px; }
  .col + .col { border-left: 1px solid var(--line); }
  @media (max-width: 820px) { .col + .col { border-left: 0; border-top: 1px solid var(--line); } }
  .col h3 {
    margin: 0 0 10px; font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); font-weight: 600;
  }
  .domain-mat { color: var(--mat); }
  .domain-bio { color: var(--bio); }
  .entity {
    padding: 7px 10px; border-radius: 7px; background: #0e1424;
    border: 1px solid var(--line); margin-bottom: 6px; font-size: 14px;
  }
  .entity .type { font-size: 11px; color: var(--dim); margin-left: 6px; }
  .arrow { text-align: center; color: var(--dim); font-size: 12px; }
  .riser {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 16px 8px; background: #101728;
  }
  .riser .score { font-size: 22px; font-weight: 700; color: var(--accent); }
  .riser .lab { font-size: 11px; color: var(--dim); letter-spacing: .06em; }
  .align { font-size: 11px; color: var(--dim); text-align: center; line-height: 1.5; }
  .cards { padding: 0 16px 16px; }
  .card {
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    margin-top: 10px; background: #0e1424;
  }
  .card h4 {
    margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; color: var(--accent);
    text-transform: uppercase;
  }
  .card.hyp h4 { color: #7dd3fc; }
  .card.diff h4 { color: var(--warn); }
  .card.cite h4 { color: var(--dim); }
  .card p { margin: 0; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin-bottom: 4px; }
  .quote {
    font-family: Consolas, "Courier New", monospace; font-size: 12.5px;
    color: #b9c6e0; background: #0a0f1c; padding: 8px 10px;
    border-radius: 6px; border-left: 2px solid var(--accent); overflow-wrap: anywhere;
  }
  .empty, .err { padding: 26px; text-align: center; color: var(--dim); }
  .err { color: var(--bad); }
  code { background: #0a0f1c; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>概念<span>桥</span></h1>
  <span class="tag">离线极简界面 · 不依赖 node_modules，直连 <code>/api/v1</code></span>
</header>

<main>
  <form id="f">
    <input id="q" type="text" value="锂枝晶抑制" placeholder="输入领域 A 的一个具体难题" />
    <button id="go" type="submit">检索跨域桥</button>
  </form>
  <div class="presets" id="presets"></div>

  <div class="bar" id="bar"><span>正在读取 /api/v1/health …</span></div>
  <div id="out" class="empty">输入问题后按「检索跨域桥」，或点上面的示例。</div>
</main>

<script>
const PRESETS = ["锂枝晶抑制", "催化剂失活", "蛋白质折叠"];
const out = document.getElementById("out");
const bar = document.getElementById("bar");
const go = document.getElementById("go");
const input = document.getElementById("q");
let health = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

function domainClass(d) {
  const s = String(d || "");
  if (s.includes("bio") || s.includes("med")) return "domain-bio";
  if (s.includes("mater") || s.includes("chem")) return "domain-mat";
  return "";
}
const shortDomain = (d) => String(d || "unknown").replace(/_/g, " ");

async function loadHealth() {
  try {
    const r = await fetch("/api/v1/health");
    health = await r.json();
  } catch (e) {
    health = null;
  }
  renderBar();
}

function renderBar() {
  if (!health) {
    bar.innerHTML = '<span class="badge bad">health 不可达</span><span>后端没起来？试 <code>uv run task demo</code></span>';
    return;
  }
  const ready = health.graph_ready;
  bar.innerHTML = [
    `<span class="badge ${ready ? "ok" : "warn"}">${ready ? "真实语料" : "预置样例"}</span>`,
    `<span>graph_version <code>${esc(health.graph_version)}</code></span>`,
    `<span>demo_mode <code>${esc(health.demo_mode)}</code></span>`,
    health.demo_mode ? `<span class="badge warn">断网演示：LLM 只读缓存</span>` : "",
    !ready ? `<span class="badge warn">当前只有样例语料，真实检索需先装 data/index</span>` : "",
  ].join("");
}

function entityLine(ref) {
  return `<div class="entity">${esc(ref.surface)}<span class="type">${esc(ref.type)}</span></div>`;
}

function renderBridge(b, i) {
  const src = b.alignment?.[0];
  const tm = b.target_mechanism;
  const s = b.scores || {};
  const aligns = (b.alignment || [])
    .map((a) => `${esc(a.source_concept_id)} → ${esc(a.target_concept_id)}`)
    .join("<br>");
  const diffs = (b.differences || []).map((d) => `<li>${esc(d)}</li>`).join("");
  const cites = (b.citations || [])
    .map((c) => `<p class="quote">${esc(c.span)}</p>
                 <p class="tag">paper ${esc(c.paper_id)} · chars ${esc(c.char_start)}–${esc(c.char_end)}</p>`)
    .join("");

  return `
  <section class="bridge">
    <div class="bridge-head">
      <span>桥 #${i + 1}</span>
      <span>structural ${esc((s.structural ?? 0).toFixed(3))} ·
            semantic ${esc((s.semantic ?? 0).toFixed(3))} ·
            domain ${esc((s.domain_distance ?? 0).toFixed(3))} ·
            triviality ${esc((s.triviality ?? 0).toFixed(3))}</span>
    </div>
    <div class="cols">
      <div class="col">
        <h3 class="${domainClass(src?.source_domain)}">源 · ${esc(shortDomain(src?.source_domain))}</h3>
        ${entityLine(tm ? { surface: b.alignment?.[0]?.reason || "源机制", type: "source" } : {})}
      </div>
      <div class="riser">
        <div class="lab">FINAL</div>
        <div class="score">${esc((s.final ?? 0).toFixed(2))}</div>
        <div class="align">${aligns || "无对齐信息"}</div>
      </div>
      <div class="col">
        <h3 class="${domainClass(b.target_domain)}">目标 · ${esc(shortDomain(b.target_domain))}</h3>
        ${entityLine(tm.subject)}
        <div class="arrow">↓ ${esc(tm.action.verb)} (${esc(tm.action.action_class)})</div>
        ${entityLine(tm.object)}
      </div>
    </div>
    <div class="cards">
      <div class="card hyp">
        <h4>可迁移假设</h4>
        <p>${esc(b.transferable_hypothesis)}</p>
      </div>
      ${diffs ? `<div class="card diff"><h4>差异（为什么不能照搬）</h4><ul>${diffs}</ul></div>` : ""}
      ${cites ? `<div class="card cite"><h4>原文出处</h4>${cites}</div>` : ""}
    </div>
  </section>`;
}

function renderResult(r) {
  if (!r.bridges || !r.bridges.length) {
    out.className = "empty";
    out.textContent = "没有找到跨域桥。放宽查询词，或先确认图谱已安装。";
    return;
  }
  const m = r.meta || {};
  const flags = [
    m.stub ? '<span class="badge warn">stub：走样例数据</span>' : "",
    m.degraded ? '<span class="badge bad">degraded：算法降级</span>' : "",
  ].join("");

  out.className = "";
  out.innerHTML = `
    <div class="bar">
      <span class="badge ok">${r.bridges.length} 条桥</span>
      <span>query <code>${esc(r.query)}</code></span>
      <span>${esc(m.latency_ms)} ms · 候选 ${esc(m.candidates)}</span>
      <span>graph_version <code>${esc(m.graph_version)}</code></span>
      ${flags}
    </div>
    ${r.bridges.map(renderBridge).join("")}`;
}

async function run(query) {
  input.value = query;
  go.disabled = true;
  out.className = "empty";
  out.textContent = "检索中…";
  try {
    const res = await fetch("/api/v1/bridge", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, top_k: 3 }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.message || `${res.status} ${res.statusText}`);
    }
    renderResult(await res.json());
  } catch (e) {
    out.className = "err";
    out.textContent = "检索失败：" + e.message;
  } finally {
    go.disabled = false;
  }
}

document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (q) run(q);
});

const pbox = document.getElementById("presets");
PRESETS.forEach((p) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = p;
  b.addEventListener("click", () => run(p));
  pbox.appendChild(b);
});

loadHealth();
</script>
</body>
</html>
