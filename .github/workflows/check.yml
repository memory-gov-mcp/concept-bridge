name: check

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra analyze --frozen

      - name: Unit and contract check
        run: uv run task check

      - name: Demo query smoke
        run: uv run task e2e

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      # The manifest is available after checkout, when step conditions can use hashFiles.
      - name: Set up Node.js
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        if: hashFiles('web/package.json') != ''
        run: npm ci

      - name: Check frontend
        if: hashFiles('web/package.json') != ''
        run: |
          npm run typecheck
          npm test
          npm run build
