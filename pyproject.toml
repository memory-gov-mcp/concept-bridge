[project]
name = "conceptbridge"
version = "0.1.0"
description = "跨学科结构类比检索：输入领域 A 的难题，从领域 B 检索结构相似的机制"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<0.29",
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
# P1/P2 用：抓取、建图、向量、评测。torch 不在此列表，见 AGENTS.md §6。
analyze = [
    "numpy>=1.26,<3",
    "networkx>=3.3,<4",
    "pandas>=2.2,<3",
    "pyarrow>=17,<20",
    "fastembed>=0.4,<0.6",
    "orjson>=3.10,<4",
]
# 开发工具放 dependency-groups：`uv sync` 默认就装，不需要记 --extra dev。
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0,<7",
    "ruff>=0.7,<0.9",
    "mypy>=1.11,<2",
]

[project.scripts]
task = "conceptbridge.task:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conceptbridge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/conceptbridge/common", "src/conceptbridge/api"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
